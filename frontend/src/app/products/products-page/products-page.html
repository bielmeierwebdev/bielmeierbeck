<div class="products-page">
  <div class="products-header">
    <div class="header-text">
      <h1>Produkte</h1>

      <p>Verwalte alle Produkte der Bäckerei</p>
    </div>

    <p-button label="Neues Produkt" icon="pi pi-plus" (onClick)="openCreateProduct()"> </p-button>
  </div>

  <div class="products-card">
    <div class="products-toolbar">
      <div class="search-box">
        <i class="pi pi-search"></i>

        <input
          pInputText
          type="text"
          placeholder="Produkte suchen..."
          [(ngModel)]="searchTerm"
          (input)="searchProducts()"
        />
      </div>
    </div>

    <p-table
      [value]="filteredProducts"
      [paginator]="true"
      [rows]="8"
      responsiveLayout="scroll"
      styleClass="products-table"
    >
      <ng-template pTemplate="header">
        <tr>
          <th>Name</th>

          <th>Kategorie</th>

          <th>Typ</th>

          <th>Preis</th>

          <th>Status</th>

          <th class="actions-column">Aktionen</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-product>
        <tr>
          <td>
            <div class="product-name">
              {{ product.name }}
            </div>
          </td>

          <td>
            <p-tag
              [value]="getCategoryLabel(product.category)"
              [severity]="getCategorySeverity(product.category)"
            >
            </p-tag>
          </td>

          <td>
            <p-tag [value]="getTypeLabel(product.type)" [severity]="getTypeSeverity(product.type)">
            </p-tag>
          </td>

          <td>{{ formatPrice(product) }} €</td>

          <td>
            <div class="status-switch">
              <p-toggleswitch
                [ngModel]="product.active"
                [ngModelOptions]="{ standalone: true }"
                (onChange)="toggleProductStatus(product, $event.checked)"
              >
              </p-toggleswitch>

              <span>
                {{ product.active ? 'Aktiv' : 'Inaktiv' }}
              </span>
            </div>
          </td>

          <td>
            <div class="table-actions">
              <button
                pButton
                icon="pi pi-pencil"
                text
                rounded
                severity="secondary"
                (click)="openEditProduct(product)"
              ></button>

              <button
                pButton
                icon="pi pi-trash"
                text
                rounded
                severity="danger"
                (click)="deleteProduct(product)"
              ></button>
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>

<p-drawer
  [(visible)]="drawerVisible"
  position="right"
  [style]="{ width: '95vw', maxWidth: '450px' }"
  [header]="isEditMode ? 'Produkt bearbeiten' : 'Neues Produkt'"
>
  <form [formGroup]="productForm" class="product-form">
    <div class="field">
      <label>Name</label>

      <input pInputText formControlName="name" />
    </div>

    <div class="field">
      <label>Preis</label>

      <input pInputText type="number" formControlName="price" />
    </div>

    <div class="field">
      <label>Kategorie</label>

      <p-select
        [options]="categoryOptions"
        optionLabel="label"
        optionValue="value"
        formControlName="category"
      >
      </p-select>
    </div>

    <div class="field">
      <label>Typ</label>

      <p-select
        [options]="typeOptions"
        optionLabel="label"
        optionValue="value"
        formControlName="type"
      >
      </p-select>
    </div>

    <div class="field">
      <label>Status</label>

      <p-tag
        [value]="productForm.get('active')?.value ? 'Aktiv' : 'Inaktiv'"
        [severity]="productForm.get('active')?.value ? 'success' : 'contrast'"
      >
      </p-tag>
    </div>

    <p-button
      [disabled]="productForm.invalid"
      [label]="isEditMode ? 'Speichern' : 'Produkt anlegen'"
      icon="pi pi-save"
      (onClick)="saveProduct()"
    >
    </p-button>
  </form>
</p-drawer>

<p-confirmdialog></p-confirmdialog>

<p-toast></p-toast>
