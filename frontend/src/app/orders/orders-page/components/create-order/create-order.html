<div class="create-order-layout">
  <div class="left-side">
    <div class="customer-section">
      <div class="customer-header">
        <h2>Kunde</h2>

        <div class="customer-actions">
          <button class="customer-action-btn" (click)="customerDialogVisible = true">
            + Kunde
          </button>

          <button class="customer-action-btn ai-btn" (click)="aiDialogVisible = true">✨ KI</button>
        </div>
      </div>

      <input
        type="text"
        placeholder="Kunde suchen..."
        [(ngModel)]="customerSearch"
        (input)="searchCustomers()"
      />

      <div class="customer-results" *ngIf="filteredCustomers.length">
        <div
          class="customer-result"
          *ngFor="let customer of filteredCustomers"
          (click)="selectCustomer(customer)"
        >
          <strong>
            {{ customer.name }}
          </strong>
        </div>
      </div>
    </div>

    <div class="products-section">
      <h2>Produkte</h2>

      <div class="products-grid">
        <button class="product-card" *ngFor="let product of products" (click)="addProduct(product)">
          <span class="product-name">
            {{ product.name }}
          </span>
        </button>
      </div>
    </div>
  </div>

  <div class="cart-section">
    <h2>Bestellung</h2>

    <div class="empty-cart" *ngIf="!cart.length">Noch keine Produkte ausgewählt</div>

    <div class="cart-items" *ngIf="cart.length">
      <div class="cart-item" *ngFor="let item of cart">
        <div class="cart-item-left">
          <div class="quantity-controls">
            <button class="quantity-btn" (click)="decreaseQuantity(item)">-</button>

            <span class="cart-quantity">
              {{ item.quantity }}
            </span>

            <button class="quantity-btn" (click)="increaseQuantity(item)">+</button>
          </div>

          <span class="cart-name">
            {{ item.name }}
          </span>
        </div>

        <div class="cart-right">
          <div class="cart-price">
            {{ (item.quantity * item.prices[0].price).toFixed(2) }}
            €
          </div>

          <button class="remove-btn" (click)="removeProduct(item)">✕</button>
        </div>
      </div>
    </div>

    <div class="cart-footer" *ngIf="cart.length">
      <div class="cart-total">
        <span> Gesamt </span>

        <strong>
          {{ getTotal().toFixed(2) }}
          €
        </strong>
      </div>

      <button class="save-order-btn" (click)="saveOrder()">Bestellung speichern</button>

      <button
        type="button"
        *ngIf="aiAnalysisResult !== null"
        class="save-order-btn"
        (click)="nextAiOrder()"
      >
        Nächste KI Bestellung
      </button>
    </div>
  </div>
</div>

<p-dialog
  [(visible)]="aiDialogVisible"
  [modal]="true"
  [dismissableMask]="true"
  [closable]="true"
  [blockScroll]="false"
  [style]="{ width: '700px' }"
  header="KI Bestellung"
  appendTo="body"
>
  <div class="ai-order-dialog">
    <textarea
      rows="12"
      placeholder="WhatsApp Nachricht einfügen..."
      [(ngModel)]="aiText"
    ></textarea>

    <button type="button" class="analyze-btn" (click)="analyzeAiText()">
      Bestellung analysieren
    </button>
  </div>
</p-dialog>

<p-dialog
  [(visible)]="customerDialogVisible"
  [modal]="true"
  [style]="{ width: '500px' }"
  header="Neuer Kunde"
  appendTo="body"
>
  <div class="customer-dialog">
    <input type="text" placeholder="Name" [(ngModel)]="newCustomer.name" />

    <button class="save-customer-btn" (click)="saveCustomer()">Kunde speichern</button>
  </div>
</p-dialog>
