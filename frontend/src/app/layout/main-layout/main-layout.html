<div class="layout">
  <button class="mobile-menu-btn" (click)="mobileMenuOpen = !mobileMenuOpen">☰</button>

  <div class="mobile-overlay" *ngIf="mobileMenuOpen" (click)="mobileMenuOpen = false"></div>

  <aside class="sidebar" [class.mobile-open]="mobileMenuOpen">
    <div class="logo-area">
      <img src="logo_white.png" alt="Bielmeier Beck" />
    </div>

    <nav class="navigation">
      <a routerLink="/dashboard" (click)="mobileMenuOpen = false"> Dashboard </a>

      <a routerLink="/customers" (click)="mobileMenuOpen = false"> Kunden </a>

      <a routerLink="/products" (click)="mobileMenuOpen = false"> Produkte </a>

      <a routerLink="/orders" (click)="mobileMenuOpen = false"> Bestellungen </a>

      <a routerLink="/employees" (click)="mobileMenuOpen = false"> Mitarbeiter </a>
    </nav>
  </aside>

  <div class="page-wrapper">
    <header class="topbar">
      <div *ngIf="!mobileMenuOpen">Willkommen 👋</div>

      <div class="topbar-actions">
        <button class="theme-btn" (click)="toggleTheme()">🌙</button>

        <button class="logout-btn">Logout</button>
      </div>
    </header>

    <main class="content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
